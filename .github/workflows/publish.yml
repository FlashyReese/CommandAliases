name: Publish
on:
  release:
    types:
      - published
jobs:
  publish:
    if: github.repository_owner == 'FlashyReese'
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          cache-disabled: true
          cache-provider: basic
      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true
      - name: Upload assets to releases
        run: ./gradlew build publishAllPublicationsToFlashyReeseReleasesRepository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      - name: Publish NeoForge to Modrinth, CurseForge & GitHub
        uses: Kira-NT/mc-publish@995edadc13559a8b28d0b7e6571229f067ec7659 # v3.3.0
        with:
          modrinth-id: dHTBnV1v
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 409389
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-type: release
          loaders: fabric
          version-resolver: latest
          dependencies: |
            luckperms | recommends | *
