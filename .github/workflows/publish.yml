name: Publish Release

on:
  release:
    types:
      - published

jobs:
  publish:
    if: github.repository_owner == 'FlashyReese'
    permissions:
      contents: write
    runs-on: self-hosted
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          check-latest: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Upload assets to releases
        run: ./gradlew build publishAllPublicationsToFlashyReeseReleasesRepository
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          BUILD_RELEASE: ${{ github.event.prerelease == false }}
      - name: Publish to Modrinth & CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.1
        with:
          modrinth-id: dHTBnV1v
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 409389
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          github-token: ${{ secrets.GITHUB_TOKEN }}

          version-type: release
          environment: client

          loaders: fabric

          game-version-filter: releases
          dependencies: |
            luckperms(recommended)
